<svg viewBox="0 0 680 304" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; stroke: none; }
    .t-l1 { font-size: 15px; fill: #111827; }
